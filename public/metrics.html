<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ghc-proxy · Metrics</title>
  <link rel="stylesheet" href="/app.css" />
  <style>
    /* Page-specific only; everything shared lives in /app.css. */
    .metrics-toolbar { display: grid; grid-template-columns: 1fr auto auto auto; gap: 0.5rem; }
    .right { text-align: right; }
    #rows td { font-size: 0.82rem; padding: 0.4rem 0.75rem; vertical-align: top; }
    /* Label sets are long enough to push the value off-screen. Wrap them so
     * the number — the reason you opened the page — always stays visible. */
    #rows td:nth-child(2) { white-space: normal; word-break: break-word; }
    th:last-child, #rows td:last-child { width: 1%; }
  </style>
</head>
<body data-page="metrics">
  <nav class="nav">
    <div class="nav-inner">
      <a class="brand" href="/">ghc-proxy</a>
      <div class="nav-links">
        <a href="/">Overview</a>
        <a href="/requests">Requests</a>
        <a href="/metrics/dashboard">Metrics</a>
      </div>
      <div class="nav-status" id="navStatus"><span class="dot"></span> connecting…</div>
    </div>
  </nav>

  <div class="wrap">
    <div class="panel">
      <div class="panel-head">
        <h2>OpenMetrics explorer</h2>
        <span class="aside" id="meta">Loading metrics…</span>
      </div>
      <div class="panel-body">
        <div class="metrics-toolbar">
          <input id="filter" placeholder="Filter by metric name, label or value — e.g. requests_total or endpoint=&quot;/v1/messages&quot;" />
          <button id="refresh">Refresh</button>
          <button id="reloadCfg">Reload config</button>
          <button id="copyRaw">Copy raw</button>
        </div>
      </div>
      <div class="panel-body flush scroll-y">
        <table>
          <thead>
            <tr><th>Metric</th><th>Labels</th><th class="right">Value</th></tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
        <div class="empty" id="metricsEmpty" style="display:none">No metric matches that filter.</div>
      </div>
      <div class="pager">Raw exporter: <a href="/metrics" target="_blank">/metrics</a></div>
    </div>
  </div>

  <script>
    let allRows = [];
    let rawText = '';

    function parseMetrics(text) {
      const rows = [];
      const lines = text.split(/\r?\n/);
      for (const line of lines) {
        const l = line.trim();
        if (!l || l.startsWith('#')) continue;
        const m = l.match(/^([a-zA-Z_:][a-zA-Z0-9_:]*)(\{[^}]*\})?\s+(.+)$/);
        if (!m) continue;
        rows.push({
          name: m[1],
          labels: (m[2] || '').replace(/^\{|\}$/g, ''),
          value: m[3]
        });
      }
      return rows;
    }

    function render() {
      const q = document.getElementById('filter').value.trim().toLowerCase();
      const filtered = !q
        ? allRows
        : allRows.filter(r => (
            r.name.toLowerCase().includes(q) ||
            r.labels.toLowerCase().includes(q) ||
            r.value.toLowerCase().includes(q)
          ));

      document.getElementById('rows').innerHTML = filtered.map(r => `
        <tr>
          <td class="mono">${escapeHtml(r.name)}</td>
          <td class="mono">${escapeHtml(r.labels || '-')}</td>
          <td class="mono right">${escapeHtml(r.value)}</td>
        </tr>
      `).join('');

      document.getElementById('metricsEmpty').style.display = filtered.length ? 'none' : '';
      document.getElementById('meta').textContent =
        `${filtered.length} of ${allRows.length} metrics`;
    }

    function escapeHtml(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[c]);
    }

    async function refresh() {
      const res = await fetch('/metrics');
      rawText = await res.text();
      allRows = parseMetrics(rawText);
      render();
    }

    async function reloadConfig() {
      const res = await fetch('/api/config/reload', { method: 'POST' });
      const data = await res.json();
      const d = data && data.config ? data.config : {};
      alert(`Config reloaded\n\npath: ${data.config_path || '-'}\ndebug: ${d.debug}\naccount_type: ${d.account_type}\nmax_connection_retries: ${d.max_connection_retries}`);
    }

    async function copyRaw() {
      const btn = document.getElementById('copyRaw');
      await navigator.clipboard.writeText(rawText || '');
      btn.textContent = 'Copied';
      setTimeout(() => { btn.textContent = 'Copy raw'; }, 1200);
    }

    // Same status pill as the other pages, so "is the proxy healthy" never
    // requires navigating away from what you are reading.
    async function navStatus() {
      try {
        const h = await (await fetch('/health')).json();
        document.getElementById('navStatus').innerHTML =
          `<span class="dot ${h.ready ? 'ok' : 'warn'}"></span>${h.ready ? 'ready' : 'degraded'} · v${escapeHtml(h.version)}`;
      } catch (e) {
        document.getElementById('navStatus').innerHTML = '<span class="dot err"></span>unreachable';
      }
    }

    document.getElementById('refresh').onclick = refresh;
    document.getElementById('reloadCfg').onclick = reloadConfig;
    document.getElementById('copyRaw').onclick = copyRaw;
    document.getElementById('filter').oninput = render;

    navStatus();
    refresh();
    setInterval(refresh, 5000);
    setInterval(navStatus, 15000);
  </script>
</body>
</html>
