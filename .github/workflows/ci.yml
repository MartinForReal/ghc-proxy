name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build, lint & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --locked --verbose

      - name: Test
        run: cargo test --locked --verbose

  plugin:
    name: Test Headroom plugin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: plugins/headroom-ghc/pyproject.toml

      - name: Install plugin
        run: |
          python -m pip install --upgrade pip build "setuptools>=77,<82"
          python -m pip install ./plugins/headroom-ghc
          python -m pip check

      - name: Test plugin
        run: python -m unittest discover -s plugins/headroom-ghc/tests -v

      - name: Build plugin wheel
        run: python -m build --wheel --no-isolation --outdir dist plugins/headroom-ghc

      - name: Validate plugin wheel
        run: python plugins/headroom-ghc/tests/verify_wheel.py dist/headroom_ghc_plugin-*.whl
